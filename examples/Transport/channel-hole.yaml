fermi_circle:
  kF: 1.0
  vF: 1.0
  n_theta: 32
  n_r: 1
  tau_p: .inf
  tau_ee: .inf
  r_c: .inf
  specularity: 1.0

geometry:
  mesh:
    triangulate:
      max-area: 0.0004
      vertices: [
        [0.0, 0.0], [1.0, 0.0], [1.0, 1.25], [0.0, 1.25],
        [0.600, 0.500], [0.595, 0.531], [0.581, 0.559], [0.559, 0.581],
        [0.531, 0.595], [0.500, 0.600], [0.469, 0.595], [0.441, 0.581],
        [0.419, 0.559], [0.405, 0.531], [0.400, 0.500], [0.405, 0.469],
        [0.419, 0.441], [0.441, 0.419], [0.469, 0.405], [0.500, 0.400],
        [0.531, 0.405], [0.559, 0.419], [0.581, 0.441], [0.595, 0.469],
      ]
      segments: [
        [0, 1], [1, 2], [2, 3], [3, 0],  # outer boundary
        [4, 5], [5, 6], [6, 7], [7, 8], [8, 9],
        [9, 10], [10, 11], [11, 12], [12, 13], [13, 14],
        [14, 15], [15, 16], [16, 17], [17, 18], [18, 19],
        [19, 20], [20, 21], [21, 22], [22, 23], [23, 4],  # circular hole
      ]
      holes:
      - [0.5, 0.5]
      contacts:
        source: [0.0, 0.125, 0.125]
        drain: [1.0, 0.125, 0.125]
        s-probe: [0.0, 0.5, 0.125]
        d-probe: [1.0, 0.5, 0.125]
  compile: no
  contacts:
    source:
      dmu: +0.1
    drain:
      dmu: -0.1

time_evolution: 
  t_max: 10.0
  dt_save: 10.0
  dt_probe: 0.1
  n_collate: 4
  integrator: RK2

checkpoint: null
checkpoint_out: results/frame{:04d}.h5
