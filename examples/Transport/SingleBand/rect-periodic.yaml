# Single-band charge transport on the finite-volume triangle mesh (FiniteVolume),
# driven by source/drain contacts.  Generate the mesh first, from this folder:
#     python ../make_rect_mesh.py --out ../rect-domain-tri.npz
single_band:
  lattice:
    periodic: [True, True, False]
    system:
      name: hexagonal
      a: 4.651
      c: 15  # irrelevant
  kmesh: [1000, 1000, 1]
  mu: 0.3 eV
  T: 50 K
  v: 0.375

finite_volume:
  mesh_file: ../rect-domain-tri.npz
  cfl: 1.0
  contacts:
    source:
      dmu: 0.005 eV
    drain:
      dmu: -0.005 eV

time_evolution:
  t_max: 40.0 ps
  dt_save: 1 ps
  n_collate: 32

checkpoint_out: animation/advect_{:04d}.h5
