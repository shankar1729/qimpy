single_band:
  lattice:
    periodic: [True, True, False]
    system:
      name: hexagonal
      a: 4.651
      c: 15  # irrelevant
  kmesh: [1000, 1000, 1]
  mu: 0.3 eV
  T: 50 K
  v: 0.375

geometry:
  rect:
    Lx: 100.0 nm
    Ly: 125.0 nm
    Nx: 24
    Ny: 30
    contacts:
      source: [ 0.0 nm, 12.5 nm, 12.5 nm ]
      drain: [ 100.0 nm, 12.5 nm, 12.5 nm ]
  contacts:
    source:
      dmu: 0.005 eV
    drain:
      dmu: -0.005 eV

time_evolution:
  t_max: 40.0 ps
  dt_save: 1 ps
  n_collate: 32

checkpoint_out: results/frame{:04d}.h5
