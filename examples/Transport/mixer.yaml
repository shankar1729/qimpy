fermi_surface:
  kF: 1.0
  vF: 1.0
  M_theta: 12
  Nr: 1
  tau_p: .inf
  tau_ee: .inf
  r_c: .inf
  specularity: 1.0

spatial_transport:
  mesh:
    file:
      name: mixer-mesh.h5  # generate using make_mixer_mesh.py
  compile: true
  contacts:
    source:
      dmu: +0.1
    drain:
      dmu: -0.1

time_evolution:
  t_max: 25.0
  dt_save: 1.0
  n_collate: 16

checkpoint_out: animation/mixer_{:04d}.h5
