fermi_circle:
  kF: 1.0
  vF: 1.0
  n_theta: 24
  n_r: 1
  tau_p: .inf
  tau_ee: .inf
  r_c: .inf
  specularity: 1.0

geometry:
  mesh:
    triangulate:
      vertices: [
        [+0.75, +0.75], [+0.75, -0.75], [-0.75, +0.75], [-0.75, -0.75],
        [+20.0, +13.7], [+20.0, -13.7], [-20.0, +13.7], [-20.0, -13.7],
        [+13.7, +20.0], [-13.7, +20.0], [+13.7, -20.0], [-13.7, -20.0],
      ]
      segments: [
        [0, 2], [2, 3], [3, 1], [1, 0],  # inner square
        [0, 1], [1, 5], [5, 4], [4, 0],  # right arm
        [3, 2], [2, 6], [6, 7], [7, 3],  # left arm
        [2, 0], [0, 8], [8, 9], [9, 2],  # top arm
        [1, 3], [3, 11], [11, 10], [10, 1],  # bottom arm
      ]
      regions:
        inner: [0.0, 0.0]
        right: [10.0, 0.0]
        left: [-10.0, 0.0]
        top: [0.0, 10.0]
        bottom: [0.0, -10.0]
      contacts:
        source: [0.0, -20.0, 13.7, 0.001]  # bottom face (contact)
        drain: [-20.0, 0.0, 0.001, 13.7]  # left face (contact)
        opp-source: [0.0, 20.0, 13.7, 0.001]  # top face (floating probe)
        opp-drain: [20.0, 0.0, 0.001, 13.7]  # right face (floating probe)
      max_area: 0.15
  compile: no
  contacts:
    source:
      dmu: +0.1
    drain:
      dmu: -0.1

time_evolution:
  t_max: 100.0
  dt_save: 100.0
  dt_probe: 1.0
  n_collate: 4

checkpoint: null
checkpoint_out: results/frame{:04d}.h5
