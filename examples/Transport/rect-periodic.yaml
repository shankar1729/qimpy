# Ab-initio material on the finite-volume triangle mesh (FiniteVolume), driven by
# magnetized source/drain contacts.  Supply your own ab-initio data file (the
# HDF5 written by qimpy.transport.material.ab_initio.read) and a triangle mesh
# with matching 'source'/'drain' boundary markers.
ab_initio:
  file: ldbd-CsPbBr3-dft.h5
  T: 300 K
  mu: 0.528824 eV

finite_volume:
  mesh_file: rect-domain-tri.npz
  cfl: 1.0
  contacts:
    source:
      dmu: 0.1
      Bfield: [0., 1. T, 0.]
    drain:
      dmu: -0.1
      Bfield: [0., -1. T, 0.]

time_evolution:
  t_max: 40.0 ps
  dt_save: 0.2 ps
  n_collate: 32

checkpoint_out: animation/advect_{:04d}.h5
