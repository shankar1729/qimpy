# Mixer/cross device solved with the finite-volume triangle-mesh transport
# (tri_set). The mesh is external (qimpy does not mesh); generate it first with:
#     python make_mixer_mesh.py --out mixer-tri.npz
# Ballistic limit (tau, r_c = inf): source/drain on two arms; the other two
# arms default to reflective walls.
fermi_surface:
  kF: 1.0
  vF: 1.0
  M_theta: 12
  Nr: 1
  tau_p: .inf
  tau_ee: .inf
  r_c: .inf
  specularity: 1.0

tri_set:
  mesh_file: mixer-tri.npz
  contacts:
    source:
      dmu: +0.1
    drain:
      dmu: -0.1

time_evolution:
  t_max: 25.0
  dt_save: 1.0
  n_collate: 16

checkpoint_out: animation/mixer_{:04d}.h5
